[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llm-vram-optimizer"
version = "0.1.0"
description = "Hardware-aware GGUF configuration tuner for constrained VRAM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gguf>=0.19.0",
    "numpy>=2.0,<2.4",
    "psutil>=7.0",
]

[project.scripts]
vramopt = "vramopt.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-psutil>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vramopt"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vramopt"]
